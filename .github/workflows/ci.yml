name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install (exact, hash-checked versions)
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (with the coverage gate from pyproject.toml)
        run: pytest -q --cov
