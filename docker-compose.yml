# Local production-like run: `docker compose up --build`, then
#   curl 'localhost:8000/api/v1/route-fuel-plan/?start=Chicago,%20IL&finish=Houston,%20TX'
# `${VAR:-default}` values are interpolated from your shell and the repo's .env
# (so a local ORS_API_KEY is picked up). The Django secret deliberately comes
# from PROD_SECRET_KEY: the dev .env's SECRET_KEY is the insecure sentinel that
# the app refuses when DEBUG=False.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${PROD_SECRET_KEY:-compose-only-secret-change-me-0123456789abcdef}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # No TLS in front of this local compose stack.
      SECURE_SSL_REDIRECT: "False"
      TRUST_X_FORWARDED_PROTO: "False"
      ORS_API_KEY: ${ORS_API_KEY:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-}
      REDIS_URL: ${REDIS_URL:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - dbdata:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  dbdata:
